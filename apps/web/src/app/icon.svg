<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#0a0a0f"/>

  <!-- Neural network nodes -->
  <circle cx="16" cy="8" r="2.5" fill="#7c3aed"/>
  <circle cx="9" cy="16" r="2" fill="#7c3aed" opacity="0.7"/>
  <circle cx="23" cy="16" r="2" fill="#7c3aed" opacity="0.7"/>
  <circle cx="12" cy="24" r="2" fill="#a855f7" opacity="0.8"/>
  <circle cx="20" cy="24" r="2" fill="#a855f7" opacity="0.8"/>

  <!-- Connection lines -->
  <line x1="16" y1="10.5" x2="9" y2="14" stroke="#7c3aed" stroke-width="1.2" opacity="0.6"/>
  <line x1="16" y1="10.5" x2="23" y2="14" stroke="#7c3aed" stroke-width="1.2" opacity="0.6"/>
  <line x1="9" y1="18" x2="12" y2="22" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
  <line x1="23" y1="18" x2="20" y2="22" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
  <line x1="11" y1="16" x2="21" y2="16" stroke="#7c3aed" stroke-width="0.8" opacity="0.4"/>
  <line x1="12" y1="22" x2="20" y2="22" stroke="#a855f7" stroke-width="0.8" opacity="0.4"/>
  <line x1="9" y1="18" x2="20" y2="22" stroke="#a855f7" stroke-width="0.6" opacity="0.25"/>
  <line x1="23" y1="18" x2="12" y2="22" stroke="#a855f7" stroke-width="0.6" opacity="0.25"/>

  <!-- Central pulse/glow on top node -->
